<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="420" viewBox="0 0 1560 420">
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#7c3aed"/>
    </marker>
    <linearGradient id="nodeHead" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- arrows -->
  <line x1="392" y1="210" x2="468" y2="210" stroke="#7c3aed" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="792" y1="210" x2="868" y2="210" stroke="#7c3aed" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="1192" y1="210" x2="1268" y2="210" stroke="#7c3aed" stroke-width="6" marker-end="url(#arrow)"/>

  <!-- node 1: void issued -->
  <g>
    <rect x="40" y="90" width="340" height="240" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2.5"/>
    <rect x="40" y="90" width="340" height="64" rx="16" fill="url(#nodeHead)"/>
    <rect x="40" y="138" width="340" height="16" fill="url(#nodeHead)"/>
    <circle cx="74" cy="122" r="17" fill="#ffffff" opacity="0.92"/>
    <rect x="63" y="113" width="22" height="18" rx="2" fill="none" stroke="#7c3aed" stroke-width="2.6"/>
    <path d="M66 116 l5 5 l-5 5 M73 116 l5 5 l-5 5" stroke="#7c3aed" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <text x="106" y="119" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#ffffff">Void Issued</text>
    <text x="60" y="196" font-family="DejaVu Sans" font-size="19" fill="#1f2937">A void on an already</text>
    <text x="60" y="224" font-family="DejaVu Sans" font-size="19" fill="#1f2937">validated transaction</text>
    <text x="60" y="252" font-family="DejaVu Sans" font-size="19" fill="#1f2937">creates a child void</text>
    <text x="60" y="280" font-family="DejaVu Sans" font-size="19" fill="#1f2937">transaction (P-V-...).</text>
  </g>

  <!-- node 2: empty reference -->
  <g>
    <rect x="480" y="90" width="300" height="240" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2.5"/>
    <rect x="480" y="90" width="300" height="64" rx="16" fill="url(#nodeHead)"/>
    <rect x="480" y="138" width="300" height="16" fill="url(#nodeHead)"/>
    <circle cx="512" cy="122" r="17" fill="#ffffff" opacity="0.92"/>
    <path d="M505 114 l10 0 l4 8 l-10 0 z" fill="none" stroke="#7c3aed" stroke-width="2.6"/>
    <text x="508" y="126" text-anchor="middle" font-family="DejaVu Sans" font-size="11" fill="#7c3aed">X</text>
    <text x="544" y="119" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#ffffff">Empty Reference</text>
    <text x="500" y="196" font-family="DejaVu Sans" font-size="19" fill="#1f2937">Core sends the void with</text>
    <text x="500" y="224" font-family="DejaVu Sans" font-size="19" fill="#1f2937">a blank refTransId: the</text>
    <text x="500" y="252" font-family="DejaVu Sans" font-size="19" fill="#1f2937">child's provider reference</text>
    <text x="500" y="280" font-family="DejaVu Sans" font-size="19" fill="#1f2937">is not filled in yet.</text>
  </g>

  <!-- node 3: parent reference -->
  <g>
    <rect x="880" y="90" width="300" height="240" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2.5"/>
    <rect x="880" y="90" width="300" height="64" rx="16" fill="url(#nodeHead)"/>
    <rect x="880" y="138" width="300" height="16" fill="url(#nodeHead)"/>
    <circle cx="912" cy="122" r="17" fill="#ffffff" opacity="0.92"/>
    <circle cx="906" cy="118" r="5.5" fill="none" stroke="#7c3aed" stroke-width="2.6"/>
    <circle cx="918" cy="126" r="5.5" fill="none" stroke="#7c3aed" stroke-width="2.6"/>
    <path d="M910 122 l4 0" stroke="#7c3aed" stroke-width="2.6"/>
    <text x="944" y="119" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#ffffff">Parent Reference</text>
    <text x="900" y="196" font-family="DejaVu Sans" font-size="19" fill="#1f2937">Fix routes the void</text>
    <text x="900" y="224" font-family="DejaVu Sans" font-size="19" fill="#1f2937">through the parent's real</text>
    <text x="900" y="252" font-family="DejaVu Sans" font-size="19" fill="#1f2937">Authorize.Net transId,</text>
    <text x="900" y="280" font-family="DejaVu Sans" font-size="19" fill="#1f2937">like refund and capture.</text>
  </g>

  <!-- node 4: gateway accepts -->
  <g>
    <rect x="1280" y="90" width="240" height="240" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2.5"/>
    <rect x="1280" y="90" width="240" height="64" rx="16" fill="url(#nodeHead)"/>
    <rect x="1280" y="138" width="240" height="16" fill="url(#nodeHead)"/>
    <circle cx="1312" cy="122" r="17" fill="#ffffff" opacity="0.92"/>
    <path d="M1312 114 v16 M1304 124 l8 8 l16 -18" stroke="#7c3aed" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <text x="1344" y="119" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#ffffff">Void OK</text>
    <text x="1300" y="196" font-family="DejaVu Sans" font-size="19" fill="#1f2937">Authorize.Net voids the</text>
    <text x="1300" y="224" font-family="DejaVu Sans" font-size="19" fill="#1f2937">original transaction;</text>
    <text x="1300" y="252" font-family="DejaVu Sans" font-size="19" fill="#1f2937">no more 'valid reference</text>
    <text x="1300" y="280" font-family="DejaVu Sans" font-size="19" fill="#1f2937">ID required' failures.</text>
  </g>

  <text x="780" y="384" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#6b7280">The void request always names the parent transaction it targets</text>
</svg>
