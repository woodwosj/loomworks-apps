<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>{{TITLE}} | Loomworks Solutions</title>
  <!-- Shared Loomworks Apps template. Fill {{PLACEHOLDERS}}, keep inline CSS only. -->
  <style>
    :root { --brand:#7c3aed; --ink:#1f2937; --muted:#6b7280; --bg:#f8fafc; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; color:var(--ink); background:var(--bg); line-height:1.6; }
    .wrap { max-width:1560px; margin:0 auto; }
    .hero { background:linear-gradient(135deg,#2e1065 0%,var(--brand) 60%,#8b5cf6 100%); color:#fff; padding:64px 48px; }
    .hero h1 { font-size:2.4em; margin-bottom:12px; }
    .hero p { font-size:1.15em; opacity:.92; max-width:760px; }
    .badges { margin-top:18px; }
    .badge { display:inline-block; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.35); border-radius:999px; padding:4px 14px; margin-right:8px; font-size:.85em; }
    .features { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:20px; padding:40px 48px; }
    .card { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:24px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
    .card h3 { color:var(--brand); margin-bottom:8px; font-size:1.15em; }
    .screens { padding:0 48px 40px; }
    .screens h2, .how h2 { margin-bottom:16px; font-size:1.5em; }
    .screens img { width:100%; border:1px solid #e5e7eb; border-radius:10px; margin-bottom:16px; }
    .how { padding:0 48px 40px; }
    .how ol { margin-left:24px; }
    .how li { margin-bottom:8px; }
    .footer { padding:24px 48px 40px; color:var(--muted); font-size:.92em; border-top:1px solid #e5e7eb; }
    .footer a { color:var(--brand); }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <h1>{{TITLE}}</h1>
      <p>{{TAGLINE}}</p>
      <div class="badges">
        <span class="badge">Odoo 19.0</span>
        {{EDITION_BADGE}}<!-- e.g. <span class="badge">Enterprise ready</span> -->
        <span class="badge">v{{VERSION}}</span>
      </div>
    </section>

    <section class="features">
      {{FEATURE_CARDS}}<!-- 3-6 x <div class="card"><h3>X</h3><p>Y</p></div> -->
    </section>

    <section class="screens">
      <h2>Screenshots</h2>
      {{SCREENSHOTS}}<!-- <img src="img.png" alt="..."/> per shot -->
    </section>

    <section class="how">
      <h2>How it works</h2>
      <ol>
        {{HOW_STEPS}}<!-- <li>step</li> -->
      </ol>
    </section>

    <div class="footer">
      <p><strong>Support:</strong> stephen@loomworks.dev — we answer within one business day.</p>
      <p>Built and maintained by <a href="https://loomworks.solutions">Loomworks Solutions LLC</a>. {{LICENSE_NOTE}}<!-- e.g. Licensed under OPL-1 / LGPL-3 --></p>
    </div>
  </div>
</body>
</html>
