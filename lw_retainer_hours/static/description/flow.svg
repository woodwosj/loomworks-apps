<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="420" viewBox="0 0 1560 420">
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#7c3aed"/>
    </marker>
    <linearGradient id="nodeHead" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- arrows between nodes -->
  <line x1="392" y1="210" x2="468" y2="210" stroke="#7c3aed" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="792" y1="210" x2="868" y2="210" stroke="#7c3aed" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="1192" y1="210" x2="1268" y2="210" stroke="#7c3aed" stroke-width="6" marker-end="url(#arrow)"/>

  <!-- node 1: purchase / setup -->
  <g>
    <rect x="40" y="90" width="340" height="240" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2.5"/>
    <rect x="40" y="90" width="340" height="64" rx="16" fill="url(#nodeHead)"/>
    <rect x="40" y="138" width="340" height="16" fill="url(#nodeHead)"/>
    <circle cx="74" cy="122" r="17" fill="#ffffff" opacity="0.92"/>
    <path d="M66 122 h16 M74 114 v16" stroke="#7c3aed" stroke-width="3.4" stroke-linecap="round"/>
    <text x="74" y="127" text-anchor="middle" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#7c3aed">+</text>
    <text x="106" y="119" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#ffffff">Sell / Set Up Plan</text>
    <text x="60" y="196" font-family="DejaVu Sans" font-size="19" fill="#1f2937">Configure included hours,</text>
    <text x="60" y="224" font-family="DejaVu Sans" font-size="19" fill="#1f2937">in-plan &amp; overage rates,</text>
    <text x="60" y="252" font-family="DejaVu Sans" font-size="19" fill="#1f2937">cycle start day,</text>
    <text x="60" y="280" font-family="DejaVu Sans" font-size="19" fill="#1f2937">rollover policy.</text>
  </g>

  <!-- node 2: consume -->
  <g>
    <rect x="480" y="90" width="300" height="240" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2.5"/>
    <rect x="480" y="90" width="300" height="64" rx="16" fill="url(#nodeHead)"/>
    <rect x="480" y="138" width="300" height="16" fill="url(#nodeHead)"/>
    <circle cx="512" cy="122" r="17" fill="#ffffff" opacity="0.92"/>
    <path d="M506 122 h12 M512 116 v12" stroke="#7c3aed" stroke-width="3.4" stroke-linecap="round"/>
    <text x="512" y="127" text-anchor="middle" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#7c3aed">&#8722;</text>
    <text x="544" y="119" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#ffffff">Log Consumption</text>
    <text x="500" y="196" font-family="DejaVu Sans" font-size="19" fill="#1f2937">Feed from timesheets</text>
    <text x="500" y="224" font-family="DejaVu Sans" font-size="19" fill="#1f2937">(account.analytic.line)</text>
    <text x="500" y="252" font-family="DejaVu Sans" font-size="19" fill="#1f2937">or manual entry per</text>
    <text x="500" y="280" font-family="DejaVu Sans" font-size="19" fill="#1f2937">client / plan.</text>
  </g>

  <!-- node 3: cron close -->
  <g>
    <rect x="880" y="90" width="300" height="240" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2.5"/>
    <rect x="880" y="90" width="300" height="64" rx="16" fill="url(#nodeHead)"/>
    <rect x="880" y="138" width="300" height="16" fill="url(#nodeHead)"/>
    <circle cx="912" cy="122" r="17" fill="#ffffff" opacity="0.92"/>
    <path d="M905 122 h14" stroke="#7c3aed" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M912 115 v14 M905 122 l6 -6 M919 122 l-6 -6" stroke="#7c3aed" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="944" y="119" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#ffffff">Cron Closes Cycle</text>
    <text x="900" y="196" font-family="DejaVu Sans" font-size="19" fill="#1f2937">Daily cron snapshots</text>
    <text x="900" y="224" font-family="DejaVu Sans" font-size="19" fill="#1f2937">usage, applies one-cycle</text>
    <text x="900" y="252" font-family="DejaVu Sans" font-size="19" fill="#1f2937">rollover (capped),</text>
    <text x="900" y="280" font-family="DejaVu Sans" font-size="19" fill="#1f2937">computes overage hours.</text>
  </g>

  <!-- node 4: auto invoice -->
  <g>
    <rect x="1280" y="90" width="240" height="240" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2.5"/>
    <rect x="1280" y="90" width="240" height="64" rx="16" fill="url(#nodeHead)"/>
    <rect x="1280" y="138" width="240" height="16" fill="url(#nodeHead)"/>
    <circle cx="1312" cy="122" r="17" fill="#ffffff" opacity="0.92"/>
    <path d="M1312 114 v16" stroke="#7c3aed" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M1304 124 l8 8 l16 -18" stroke="#7c3aed" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <text x="1344" y="119" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#ffffff">Auto-Invoice</text>
    <text x="1300" y="196" font-family="DejaVu Sans" font-size="19" fill="#1f2937">Drafts renewal invoice</text>
    <text x="1300" y="224" font-family="DejaVu Sans" font-size="19" fill="#1f2937">with product line plus</text>
    <text x="1300" y="252" font-family="DejaVu Sans" font-size="19" fill="#1f2937">an overage line when</text>
    <text x="1300" y="280" font-family="DejaVu Sans" font-size="19" fill="#1f2937">hours exceed allowance.</text>
  </g>

  <text x="780" y="384" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#6b7280">Client sees used / remaining hours per cycle on the portal</text>
</svg>
