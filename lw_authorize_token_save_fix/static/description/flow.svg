<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="420" viewBox="0 0 1560 420">
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#7c3aed"/>
    </marker>
    <linearGradient id="nodeHead" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- arrows -->
  <line x1="392" y1="210" x2="468" y2="210" stroke="#7c3aed" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="792" y1="210" x2="868" y2="210" stroke="#7c3aed" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="1192" y1="210" x2="1268" y2="210" stroke="#7c3aed" stroke-width="6" marker-end="url(#arrow)"/>

  <!-- node 1: card save -->
  <g>
    <rect x="40" y="90" width="340" height="240" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2.5"/>
    <rect x="40" y="90" width="340" height="64" rx="16" fill="url(#nodeHead)"/>
    <rect x="40" y="138" width="340" height="16" fill="url(#nodeHead)"/>
    <circle cx="74" cy="122" r="17" fill="#ffffff" opacity="0.92"/>
    <rect x="63" y="113" width="22" height="17" rx="3" fill="none" stroke="#7c3aed" stroke-width="2.6"/>
    <path d="M63 119 h22" stroke="#7c3aed" stroke-width="2.6"/>
    <text x="106" y="119" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#ffffff">Card Save</text>
    <text x="60" y="196" font-family="DejaVu Sans" font-size="19" fill="#1f2937">Portal or staff tries to</text>
    <text x="60" y="224" font-family="DejaVu Sans" font-size="19" fill="#1f2937">store a card; core runs</text>
    <text x="60" y="252" font-family="DejaVu Sans" font-size="19" fill="#1f2937">a one-cent validation</text>
    <text x="60" y="280" font-family="DejaVu Sans" font-size="19" fill="#1f2937">authorization.</text>
  </g>

  <!-- node 2: validation auth -->
  <g>
    <rect x="480" y="90" width="300" height="240" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2.5"/>
    <rect x="480" y="90" width="300" height="64" rx="16" fill="url(#nodeHead)"/>
    <rect x="480" y="138" width="300" height="16" fill="url(#nodeHead)"/>
    <circle cx="512" cy="122" r="17" fill="#ffffff" opacity="0.92"/>
    <circle cx="512" cy="122" r="9" fill="none" stroke="#7c3aed" stroke-width="2.6"/>
    <path d="M512 113 v4 M512 127 v4 M503 122 h4 M517 122 h4" stroke="#7c3aed" stroke-width="2.4" stroke-linecap="round"/>
    <text x="544" y="119" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#ffffff">Penny Auth</text>
    <text x="500" y="196" font-family="DejaVu Sans" font-size="19" fill="#1f2937">Authorize.Net approves</text>
    <text x="500" y="224" font-family="DejaVu Sans" font-size="19" fill="#1f2937">the live authorization;</text>
    <text x="500" y="252" font-family="DejaVu Sans" font-size="19" fill="#1f2937">the token must be built</text>
    <text x="500" y="280" font-family="DejaVu Sans" font-size="19" fill="#1f2937">from this transaction.</text>
  </g>

  <!-- node 3: tokenize before void -->
  <g>
    <rect x="880" y="90" width="300" height="240" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2.5"/>
    <rect x="880" y="90" width="300" height="64" rx="16" fill="url(#nodeHead)"/>
    <rect x="880" y="138" width="300" height="16" fill="url(#nodeHead)"/>
    <circle cx="912" cy="122" r="17" fill="#ffffff" opacity="0.92"/>
    <rect x="903" y="114" width="18" height="16" rx="2.5" fill="none" stroke="#7c3aed" stroke-width="2.6"/>
    <path d="M909 122 h4 l1 2 l3 -4" stroke="#7c3aed" stroke-width="1.8" fill="none"/>
    <text x="944" y="119" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#ffffff">Tokenize First</text>
    <text x="900" y="196" font-family="DejaVu Sans" font-size="19" fill="#1f2937">Fix orders the flow:</text>
    <text x="900" y="224" font-family="DejaVu Sans" font-size="19" fill="#1f2937">customer profile created</text>
    <text x="900" y="252" font-family="DejaVu Sans" font-size="19" fill="#1f2937">from the live auth BEFORE</text>
    <text x="900" y="280" font-family="DejaVu Sans" font-size="19" fill="#1f2937">the void is sent.</text>
  </g>

  <!-- node 4: card stored -->
  <g>
    <rect x="1280" y="90" width="240" height="240" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2.5"/>
    <rect x="1280" y="90" width="240" height="64" rx="16" fill="url(#nodeHead)"/>
    <rect x="1280" y="138" width="240" height="16" fill="url(#nodeHead)"/>
    <circle cx="1312" cy="122" r="17" fill="#ffffff" opacity="0.92"/>
    <path d="M1306 120 h6 l4 4 l8 -10" stroke="#7c3aed" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <text x="1344" y="119" font-family="DejaVu Sans" font-size="26" font-weight="bold" fill="#ffffff">Card Stored</text>
    <text x="1300" y="196" font-family="DejaVu Sans" font-size="19" fill="#1f2937">Token saved, then the</text>
    <text x="1300" y="224" font-family="DejaVu Sans" font-size="19" fill="#1f2937">penny auth is voided</text>
    <text x="1300" y="252" font-family="DejaVu Sans" font-size="19" fill="#1f2937">cleanly; 'could not be</text>
    <text x="1300" y="280" font-family="DejaVu Sans" font-size="19" fill="#1f2937">saved' is gone.</text>
  </g>

  <text x="780" y="384" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#6b7280">Tokenization runs against a live authorization, never a voided one</text>
</svg>
