<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="520" viewBox="0 0 1560 520">
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#7c3aed"/>
    </marker>
    <linearGradient id="nodeHead" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- top lane arrows -->
  <line x1="352" y1="150" x2="408" y2="150" stroke="#7c3aed" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="732" y1="150" x2="788" y2="150" stroke="#7c3aed" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="1112" y1="150" x2="1168" y2="150" stroke="#7c3aed" stroke-width="6" marker-end="url(#arrow)"/>

  <!-- N1: portal payment -->
  <g>
    <rect x="40" y="40" width="300" height="220" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2.5"/>
    <rect x="40" y="40" width="300" height="60" rx="16" fill="url(#nodeHead)"/>
    <rect x="40" y="84" width="300" height="16" fill="url(#nodeHead)"/>
    <circle cx="72" cy="70" r="16" fill="#ffffff" opacity="0.92"/>
    <rect x="61" y="61" width="22" height="17" rx="3" fill="none" stroke="#7c3aed" stroke-width="2.6"/>
    <path d="M61 67 h22" stroke="#7c3aed" stroke-width="2.6"/>
    <text x="102" y="76" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#ffffff">Portal Payment</text>
    <text x="56" y="138" font-family="DejaVu Sans" font-size="17.5" fill="#1f2937">Customer on Net 30+ terms</text>
    <text x="56" y="164" font-family="DejaVu Sans" font-size="17.5" fill="#1f2937">pays an open invoice by</text>
    <text x="56" y="190" font-family="DejaVu Sans" font-size="17.5" fill="#1f2937">credit card in the portal</text>
    <text x="56" y="216" font-family="DejaVu Sans" font-size="17.5" fill="#1f2937">payment modal.</text>
  </g>

  <!-- N2: BIN capture -->
  <g>
    <rect x="420" y="40" width="300" height="220" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2.5"/>
    <rect x="420" y="40" width="300" height="60" rx="16" fill="url(#nodeHead)"/>
    <rect x="420" y="84" width="300" height="16" fill="url(#nodeHead)"/>
    <circle cx="452" cy="70" r="16" fill="#ffffff" opacity="0.92"/>
    <circle cx="452" cy="70" r="8" fill="none" stroke="#7c3aed" stroke-width="2.6"/>
    <path d="M458 76 l8 8" stroke="#7c3aed" stroke-width="3.4" stroke-linecap="round"/>
    <text x="482" y="76" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#ffffff">BIN Capture</text>
    <text x="436" y="138" font-family="DejaVu Sans" font-size="17.5" fill="#1f2937">First six card digits</text>
    <text x="436" y="164" font-family="DejaVu Sans" font-size="17.5" fill="#1f2937">queried via self-hosted</text>
    <text x="436" y="190" font-family="DejaVu Sans" font-size="17.5" fill="#1f2937">BIN lookup: debit cards</text>
    <text x="436" y="216" font-family="DejaVu Sans" font-size="17.5" fill="#1f2937">identified and excluded.</text>
  </g>

  <!-- N3: fee line -->
  <g>
    <rect x="800" y="40" width="300" height="220" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2.5"/>
    <rect x="800" y="40" width="300" height="60" rx="16" fill="url(#nodeHead)"/>
    <rect x="800" y="84" width="300" height="16" fill="url(#nodeHead)"/>
    <circle cx="832" cy="70" r="16" fill="#ffffff" opacity="0.92"/>
    <circle cx="832" cy="70" r="9.5" fill="none" stroke="#7c3aed" stroke-width="2.6"/>
    <text x="832" y="75" text-anchor="middle" font-family="DejaVu Sans" font-size="14" font-weight="bold" fill="#7c3aed">%</text>
    <text x="862" y="76" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#ffffff">Fee Quoted &amp; Added</text>
    <text x="816" y="138" font-family="DejaVu Sans" font-size="17.5" fill="#1f2937">Surcharge shown live as</text>
    <text x="816" y="164" font-family="DejaVu Sans" font-size="17.5" fill="#1f2937">digits are typed or a saved</text>
    <text x="816" y="190" font-family="DejaVu Sans" font-size="17.5" fill="#1f2937">card is selected; waivable</text>
    <text x="816" y="216" font-family="DejaVu Sans" font-size="17.5" fill="#1f2937">checkbox on backend Pay.</text>
  </g>

  <!-- N4: surcharge invoice -->
  <g>
    <rect x="1180" y="40" width="300" height="220" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2.5"/>
    <rect x="1180" y="40" width="300" height="60" rx="16" fill="url(#nodeHead)"/>
    <rect x="1180" y="84" width="300" height="16" fill="url(#nodeHead)"/>
    <circle cx="1212" cy="70" r="16" fill="#ffffff" opacity="0.92"/>
    <path d="M1212 62 v16 M1204 72 l8 8 l16 -18" stroke="#7c3aed" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <text x="1242" y="76" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#ffffff">One-Transaction Charge</text>
    <text x="1196" y="138" font-family="DejaVu Sans" font-size="17.5" fill="#1f2937">Invoice and fee charged</text>
    <text x="1196" y="164" font-family="DejaVu Sans" font-size="17.5" fill="#1f2937">together in a single</text>
    <text x="1196" y="190" font-family="DejaVu Sans" font-size="17.5" fill="#1f2937">transaction; credit cards</text>
    <text x="1196" y="216" font-family="DejaVu Sans" font-size="17.5" fill="#1f2937">carry the surcharge fee.</text>
  </g>

  <!-- curved arrow: portal payment -> past-due AR -->
  <path d="M190 260 C 190 350, 550 350, 550 292" fill="none" stroke="#7c3aed" stroke-width="6" marker-end="url(#arrow)"/>

  <!-- N5: past-due AR -->
  <g>
    <rect x="420" y="300" width="300" height="200" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2.5"/>
    <rect x="420" y="300" width="300" height="56" rx="16" fill="url(#nodeHead)"/>
    <rect x="420" y="340" width="300" height="16" fill="url(#nodeHead)"/>
    <circle cx="452" cy="328" r="16" fill="#ffffff" opacity="0.92"/>
    <rect x="443" y="319" width="18" height="18" rx="3" fill="none" stroke="#7c3aed" stroke-width="2.6"/>
    <text x="452" y="333" text-anchor="middle" font-family="DejaVu Sans" font-size="13" font-weight="bold" fill="#7c3aed">!</text>
    <text x="482" y="334" font-family="DejaVu Sans" font-size="23" font-weight="bold" fill="#ffffff">Past-Due AR</text>
    <text x="436" y="388" font-family="DejaVu Sans" font-size="17.5" fill="#1f2937">Outstanding balance</text>
    <text x="436" y="414" font-family="DejaVu Sans" font-size="17.5" fill="#1f2937">older than 30 days,</text>
    <text x="436" y="440" font-family="DejaVu Sans" font-size="17.5" fill="#1f2937">configurable threshold.</text>
  </g>

  <line x1="732" y1="400" x2="788" y2="400" stroke="#7c3aed" stroke-width="6" marker-end="url(#arrow)"/>

  <!-- N6: service charge invoice -->
  <g>
    <rect x="800" y="300" width="300" height="200" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2.5"/>
    <rect x="800" y="300" width="300" height="56" rx="16" fill="url(#nodeHead)"/>
    <rect x="800" y="340" width="300" height="16" fill="url(#nodeHead)"/>
    <circle cx="832" cy="328" r="16" fill="#ffffff" opacity="0.92"/>
    <path d="M832 320 v8 M832 333 v2" stroke="#7c3aed" stroke-width="3.2" stroke-linecap="round"/>
    <text x="862" y="334" font-family="DejaVu Sans" font-size="23" font-weight="bold" fill="#ffffff">Service Charge Invoice</text>
    <text x="816" y="388" font-family="DejaVu Sans" font-size="17.5" fill="#1f2937">1.5% per month on</text>
    <text x="816" y="414" font-family="DejaVu Sans" font-size="17.5" fill="#1f2937">past-due AR, posted as a</text>
    <text x="816" y="440" font-family="DejaVu Sans" font-size="17.5" fill="#1f2937">monthly service charge.</text>
  </g>
</svg>
